# Ameba configuration

# Exclude lib directory
Excluded:
  - lib

# Allow not_nil! in specs - it's an intentional assertion
Lint/NotNil:
  Excluded:
    - spec/**

# Single-char block params are fine for iterators
Naming/BlockParameterName:
  Enabled: false

# Inline %({...}) JSON schemas are the spec (and README) idiom
Style/MultilineStringLiteral:
  Enabled: false
